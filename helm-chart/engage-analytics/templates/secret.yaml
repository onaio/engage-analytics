{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "engage-analytics.fullname" . }}-secrets
  labels:
    {{- include "engage-analytics.labels" . | nindent 4 }}
type: Opaque
data:
  DBT_PASSWORD: {{ .Values.secrets.env.DBT_PASSWORD | b64enc }}
  S3_BUCKET_ANON: {{ .Values.secrets.env.S3_BUCKET_ANON | b64enc }}
  S3_BUCKET_PII: {{ .Values.secrets.env.S3_BUCKET_PII | b64enc }}
  S3_BUCKET_METRICS: {{ .Values.secrets.env.S3_BUCKET_METRICS | b64enc }}
{{- end }}
